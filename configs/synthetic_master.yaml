experiment:
  name: "synthetic_robustness_comparison"
  description: >
    Systematische Robustheitsanalyse synthetischer Netzwerkmodelle
    unter zufälligen Ausfällen und gezielten Angriffen.
  output_dir: "results"

random_seed: 42

# Netzwerkdefinitionen
graphs:
  - id: "ER_n800_p0.01"
    type: "synthetic"
    model: "erdos_renyi"
    n: 800
    p: 0.01
    repetitions: 8

  - id: "WS_n800_k8_p0.1"
    type: "synthetic"
    model: "watts_strogatz"
    n: 800
    k: 8
    p: 0.1
    repetitions: 8

  - id: "BA_n800_m3"
    type: "synthetic"
    model: "barabasi_albert"
    n: 800
    m: 3
    repetitions: 8


# Angriffsszenarien
attacks:
  - id: "random_failures"
    type: "random"

  - id: "targeted_degree"
    type: "targeted"
    strategy: "degree"

  - id: "targeted_betweenness"
    type: "targeted"
    strategy: "betweenness"


# Ausfallparameter
fractions:
  start: 0.0
  end: 1.0
  step: 0.02


# Bewertungsmetriken
metrics:
  # zentrale Robustheitsmetriken
  - gcc_fraction
  - gcc_size

  # Effizienz & Erreichbarkeit
  - avg_path_length_gcc
  - diameter_gcc
  - global_efficiency

  # Strukturmetriken
  - global_clustering
  - avg_local_clustering


# Analyse- und Aggregationslogik
analysis:
  metric_for_auc: "gcc_fraction"
  aggregate_by:
    - "graph_id"
    - "attack_id"

  # Mittelwerte über Wiederholungen
  aggregation_method: "mean"


# Ausgabeoptionen
output:
  save_raw_metrics: true
  save_aggregated_metrics: true
  save_robustness_curves: true
  save_metadata: true
