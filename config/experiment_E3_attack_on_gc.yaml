experiments:
  - name: E3_attack_gc_random
    beschreibung: Smart Grid, random failures auf GC (stärkere Kopplung)
    override:
      modi: [smart_grid]
      gp.topologie: ER
      gc.topologie: ER
      interdependenz.aktiv: true
      interdependenz.q: 0.9
      interdependenz.r: 1
      stoerszenarien.szenario_typ: random
      stoerszenarien.angreifbares_netz: GC
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 200
      allgemein.schrittweite: 0.05
