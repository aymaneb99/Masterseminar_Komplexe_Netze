experiments:
  - name: E4_random_gc
    beschreibung: Smart Grid, random failures auf GC (stärkere Kopplung)
    override:
      modi: [smart_grid]
      gp.topologie: ER
      gc.topologie: BA
      interdependenz.aktiv: true
      interdependenz.q: 0.9
      interdependenz.r: 1
      stoerszenarien.szenario_typ: random
      stoerszenarien.angreifbares_netz: GC
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 200
      allgemein.schrittweite: 0.05

  - name: E4_targeted_gc_betweenness
    beschreibung: Smart Grid, targeted (betweenness) auf GC (stärkere Kopplung)
    override:
      modi: [smart_grid]
      gp.topologie: ER
      gc.topologie: BA
      interdependenz.aktiv: true
      interdependenz.q: 0.9
      interdependenz.r: 1
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: betweenness
      stoerszenarien.angreifbares_netz: GC
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 200
      allgemein.schrittweite: 0.05
