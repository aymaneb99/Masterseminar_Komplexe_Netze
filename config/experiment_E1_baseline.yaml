experiments:
  - name: E1_baseline_random_gp
    beschreibung: Konventionell, random failures auf GP
    override:
      modi: [konventionell]
      interdependenz.aktiv: false
      gp.topologie: ER
      stoerszenarien.szenario_typ: random
      stoerszenarien.angreifbares_netz: GP
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 200
      allgemein.schrittweite: 0.05

  - name: E1_baseline_targeted_gp
    beschreibung: Konventionell, targeted (degree) auf GP
    override:
      modi: [konventionell]
      interdependenz.aktiv: false
      gp.topologie: ER
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GP
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 200
      allgemein.schrittweite: 0.05
