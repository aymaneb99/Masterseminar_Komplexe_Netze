# Experimente E1 bis E8
# Pro Vergleich wird nur ein Faktor geändert.
# Gemeinsame Basis: N_GP=500, N_GC=50, 30 Runs, Schrittweite 5 %.

experiments:

  # Block 1: Konventionelle Baselines ohne GC

  - name: E1_er_random
    beschreibung: >
      Konventionelles ER-Netz unter zufälligen Ausfällen.
    override:
      modi: [konventionell]
      interdependenz.aktiv: false
      gp.topologie: ER
      stoerszenarien.szenario_typ: random
      stoerszenarien.angreifbares_netz: GP

  - name: E2_ba_random
    beschreibung: >
      Konventionelles BA-Netz unter zufälligen Ausfällen.
      Vergleich zu E1: Topologieeffekt.
    override:
      modi: [konventionell]
      interdependenz.aktiv: false
      gp.topologie: BA
      stoerszenarien.szenario_typ: random
      stoerszenarien.angreifbares_netz: GP

  - name: E3_er_targeted
    beschreibung: >
      Konventionelles ER-Netz unter gezieltem Angriff.
      Vergleich zu E1: random gegen targeted.
    override:
      modi: [konventionell]
      interdependenz.aktiv: false
      gp.topologie: ER
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GP

  - name: E4_ba_targeted
    beschreibung: >
      Konventionelles BA-Netz unter gezieltem Angriff.
      Vergleich zu E2: Wirkung auf BA-Hubs.
      Vergleich zu E3: ER gegen BA unter targeted.
    override:
      modi: [konventionell]
      interdependenz.aktiv: false
      gp.topologie: BA
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GP

  # Block 2: Smart Grid mit BA/BA und korrelierter Kopplung

  - name: E5_smartgrid_interdependenz
    beschreibung: >
      Smart Grid (BA/BA), korrelierte Deps, gezielter GC-Angriff,
      ohne Kaskade. Vergleich zu E4: indirekter Angriff.
    override:
      modi: [smart_grid]
      gp.topologie: BA
      gc.topologie: BA
      gc.N: 50
      interdependenz.aktiv: true
      interdependenz.q: 1.0
      interdependenz.r: 1
      interdependenz.correlation_mode: degree
      interdependenz.kaskade: false
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GC

  - name: E6_smartgrid_kaskade
    beschreibung: >
      Smart Grid (BA/BA), korrelierte Deps, gezielter GC-Angriff,
      mit Kaskade. Vergleich zu E5: Kaskadeneffekt.
    override:
      modi: [smart_grid]
      gp.topologie: BA
      gc.topologie: BA
      gc.N: 50
      interdependenz.aktiv: true
      interdependenz.q: 1.0
      interdependenz.r: 1
      interdependenz.correlation_mode: degree
      interdependenz.kaskade: true
      interdependenz.max_cascade_steps: 100
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GC

  - name: E7_smartgrid_redundanz_kaskade
    beschreibung: >
      Smart Grid (BA/BA), korrelierte Deps, r=2, mit Kaskade.
      Vergleich zu E6: Redundanz mit Kaskade.
    override:
      modi: [smart_grid]
      gp.topologie: BA
      gc.topologie: BA
      gc.N: 50
      interdependenz.aktiv: true
      interdependenz.q: 1.0
      interdependenz.r: 2
      interdependenz.correlation_mode: degree
      interdependenz.kaskade: true
      interdependenz.max_cascade_steps: 100
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GC

  - name: E8_smartgrid_redundanz_ohne_kaskade
    beschreibung: >
      Smart Grid (BA/BA), korrelierte Deps, r=2, ohne Kaskade.
      Vergleich zu E7: Schutzwirkung ohne Kaskade.
    override:
      modi: [smart_grid]
      gp.topologie: BA
      gc.topologie: BA
      gc.N: 50
      interdependenz.aktiv: true
      interdependenz.q: 1.0
      interdependenz.r: 2
      interdependenz.correlation_mode: degree
      interdependenz.kaskade: false
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GC
