experiments:
  # Baseline: BA-Topologie für GP (konventionell)
  - name: E7_baseline_ba_random
    beschreibung: Konventionell, BA-Topologie, random auf GP
    override:
      modi: [konventionell]
      interdependenz.aktiv: false
      gp.topologie: BA
      stoerszenarien.szenario_typ: random
      stoerszenarien.angreifbares_netz: GP
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 500
      allgemein.schrittweite: 0.05

  - name: E7_baseline_ba_targeted
    beschreibung: Konventionell, BA-Topologie, targeted (degree) auf GP
    override:
      modi: [konventionell]
      interdependenz.aktiv: false
      gp.topologie: BA
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GP
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 500
      allgemein.schrittweite: 0.05

  # Smart Grid: Random Dependencies (Kontrollgruppe)
  - name: E7_smartgrid_random_deps
    beschreibung: Smart Grid, BA/BA, q=1.0, r=1, random dependencies, targeted auf GC
    override:
      modi: [smart_grid]
      gp.topologie: BA
      gc.topologie: BA
      interdependenz.aktiv: true
      interdependenz.q: 1.0
      interdependenz.r: 1
      interdependenz.correlation_mode: random
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GC
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 500
      allgemein.schrittweite: 0.05

  # Smart Grid: Korrelierte Dependencies (Hauptexperiment)
  - name: E7_smartgrid_correlated_deps
    beschreibung: Smart Grid, BA/BA, q=1.0, r=1, korrelierte dependencies, targeted auf GC
    override:
      modi: [smart_grid]
      gp.topologie: BA
      gc.topologie: BA
      interdependenz.aktiv: true
      interdependenz.q: 1.0
      interdependenz.r: 1
      interdependenz.correlation_mode: degree
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GC
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 500
      allgemein.schrittweite: 0.05

  # Redundanz-Effekt bei korrelierter Zuweisung
  - name: E7_smartgrid_correlated_r2
    beschreibung: Smart Grid, BA/BA, q=1.0, r=2, korrelierte dependencies, targeted auf GC
    override:
      modi: [smart_grid]
      gp.topologie: BA
      gc.topologie: BA
      interdependenz.aktiv: true
      interdependenz.q: 1.0
      interdependenz.r: 2
      interdependenz.correlation_mode: degree
      stoerszenarien.szenario_typ: targeted
      stoerszenarien.targeted_metrik: degree
      stoerszenarien.angreifbares_netz: GC
      allgemein.seed: 42
      allgemein.runs: 30
      allgemein.N: 500
      allgemein.schrittweite: 0.05
