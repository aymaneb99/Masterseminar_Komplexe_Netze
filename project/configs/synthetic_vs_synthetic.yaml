experiment_name: "synthetic_comparison"
output_dir: "results"

random_seed: 42

graphs:
  - id: "ER_n1000_p0.01"
    type: "synthetic"
    model: "erdos_renyi"
    n: 1000
    p: 0.01
    repetitions: 5

  - id: "WS_n1000_k10_p0.1"
    type: "synthetic"
    model: "watts_strogatz"
    n: 1000
    k: 10
    p: 0.1
    repetitions: 5

  - id: "BA_n1000_m3"
    type: "synthetic"
    model: "barabasi_albert"
    n: 1000
    m: 3
    repetitions: 5

attacks:
  - id: "random_failures"
    type: "random"

  - id: "targeted_degree"
    type: "targeted"
    strategy: "degree"

  - id: "targeted_betweenness"
    type: "targeted"
    strategy: "betweenness"

fractions:
  start: 0.0
  end: 1.0
  step: 0.05

metrics:
  - lcc_fraction
  - average_path_length_lcc
  - global_efficiency

analysis:
  metric_for_auc: "lcc_fraction"
  aggregate_by:
    - "graph_id"
    - "attack_id"

